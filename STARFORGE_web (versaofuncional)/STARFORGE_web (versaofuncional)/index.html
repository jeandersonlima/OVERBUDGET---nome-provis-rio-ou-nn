<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>STARFORGE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="STARFORGE: projete a missão, lance o foguete e comande um rover no Polo Sul da Lua. Jogo de engenharia espacial para desktop e celular.">
    <meta name="theme-color" content="#080c18">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="STARFORGE">
    <meta property="og:type" content="website">
    <meta property="og:title" content="STARFORGE">
    <meta property="og:description" content="Projete, lance e explore a Lua. Jogue no navegador, no desktop ou no celular.">
    <meta property="og:image" content="./icons/icon-512.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080c18;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* O palco ocupa a tela toda (o tamanho exato é ajustado por src/game/responsive.js)
           e respeita as áreas seguras de celulares com notch. */
        #stage {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            background: #080c18;
            touch-action: none;
            outline: none;
        }
        #boot, noscript {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #78e4ef;
            font: 14px/1.5 monospace;
            letter-spacing: .12em;
            text-align: center;
            padding: 24px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="game-canvas" width="720" height="1280" tabindex="0" role="application" aria-label="STARFORGE, jogo de engenharia espacial"></canvas>
    </div>
    <div id="boot" role="status">CARREGANDO MISSÃO…</div>
    <noscript>Ative o JavaScript para jogar STARFORGE.</noscript>
    <script type="module" src="./game.js"></script>
</body>
</html>
